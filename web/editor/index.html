<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>محرر المتشابهات · مثاني</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="editor.css">
  <script src="editor.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="title" href="#">المتشابهات</a>

      <a class="button" href="#history">السجل</a>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <main class="layout" id="layout">
    <section class="list-pane" id="list-pane" aria-label="المجموعات"></section>
    <section class="view-pane" id="view" aria-live="polite"></section>
