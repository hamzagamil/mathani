name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7" # keep in sync with pubspec.yaml environment.flutter

jobs:
  checks:
    name: Analyze, test, verify Quran text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden,web
      # quran.db is built from licensed sources that are not in git (tool/README.md); verify the
      # committed database when present.
      - name: Verify Quran text
        if: hashFiles('assets/db/quran.db') != ''
        run: dart run tool/verify_quran.dart --db-only
      # The owner's Mutashabihat content: no release with a bad reference (specs/010 FR-016).
      - name: Check Mutashabihat content
        run: dart run tool/check_mutashabihat.dart
      # The editor's functions (specs/011); node:sqlite needs Node 22.5 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Mutashabihat editor functions
        run: node --test tool/mutashabihat/*.test.mjs
      - name: Group khatma functions and Worker
        run: node --test tool/khatma/*.test.mjs

  android:
    name: Android build, size and emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build app bundle with size analysis
        run: flutter build appbundle --release --target-platform android-arm64 --analyze-size --code-size-directory=build/size
      - name: Size check
        run: >
          dart run tool/size_check.dart android
          $(ls -t ~/.flutter-devtools/*code-size-analysis*.json | head -1)
          ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') && '--approved' || '' }}
      # The phone widgets' Kotlin tests and the Wear OS app (specs/017 T010). The Wear bundle is
      # uploaded to Play next to the phone bundle (docs/release.md).
      - name: Widget and Wear OS tests, Wear OS bundle
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :wear:bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: wear-bundle-${{ github.run_number }}
          path: build/wear/outputs/bundle/release/*.aab
          if-no-files-found: error
      # The emulator needs more free disk than the runner has after the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Integration tests on Android emulator
        if: hashFiles('integration_test/**') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test

  ios:
    name: iOS build and simulator tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # The iOS 27 SDK lets the app fill the iPhone Duo's inner screen (specs/012 research R5).
      # The xcode-27 runner image (a GitHub preview) defaults to a released Xcode 27.
      - name: Check Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.' || { echo "::error::Xcode 27 is not selected"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build iOS (no codesign) with size analysis
        run: flutter build ios --release --no-codesign --analyze-size --code-size-directory=build/size
      - name: Size check
        run: >
          dart run tool/size_check.dart ios
          $(ls -t ~/.flutter-devtools/*code-size-analysis*.json | head -1)
          ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') && '--approved' || '' }}
      # The widgets' shared Swift code (specs/017 T024, T026), and the watch app on its own.
      - name: Swift unit tests and the watch app build
        if: hashFiles('ios/Shared/WidgetSnapshot.swift') != ''
        run: |
          set -o pipefail
          flutter build ios --simulator --debug
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -destination "id=$UDID" \
            -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO | tail -60
          if xcodebuild -list -project ios/Runner.xcodeproj | grep -q MathaniWatch; then
            xcodebuild build -project ios/Runner.xcodeproj -scheme MathaniWatch \
              -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -30
          fi
      - name: Integration tests on iOS simulator (iPhone SE 3rd gen)
        if: hashFiles('integration_test/**') != ''
        run: |
          # The runner image may ship without an SE simulator: create one, else use any iPhone.
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone SE (3rd generation)" | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
            UDID=$(xcrun simctl create "iPhone SE CI" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RUNTIME" || true)
          fi
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          fi
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
