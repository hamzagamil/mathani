name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7" # keep in sync with pubspec.yaml environment.flutter

jobs:
  checks:
    name: Analyze, test, verify Quran text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      # quran.db is built from licensed sources that are not in git (tool/README.md); verify the
      # committed database when present.
      - name: Verify Quran text
        if: hashFiles('assets/db/quran.db') != ''
        run: dart run tool/verify_quran.dart --db-only

  android:
    name: Android build, size and emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build app bundle with size analysis
        run: flutter build appbundle --release --analyze-size --code-size-directory=build/size
      - name: Size check
        run: >
          dart run tool/size_check.dart android
          $(ls build/size/*code-size-analysis*.json | head -1)
          ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') && '--approved' || '' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Integration tests on Android emulator
        if: hashFiles('integration_test/**') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test

  ios:
    name: iOS build and simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build iOS (no codesign) with size analysis
        run: flutter build ios --release --no-codesign --analyze-size --code-size-directory=build/size
      - name: Size check
        run: >
          dart run tool/size_check.dart ios
          $(ls build/size/*code-size-analysis*.json | head -1)
          ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') && '--approved' || '' }}
      - name: Integration tests on iOS simulator (iPhone SE 3rd gen)
        if: hashFiles('integration_test/**') != ''
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone SE (3rd generation)" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
