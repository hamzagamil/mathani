name: iOS release

# Builds a signed App Store .ipa on macOS; TestFlight upload is explicitly opt-in.
# Run it from the Actions tab. Signing and API secrets are listed in docs/release.md.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Empty uses the +build in pubspec.yaml."
        required: false
        default: ""
        type: string
      upload_to_testflight:
        description: "Upload this build to App Store Connect / TestFlight"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.47.7" # keep in sync with pubspec.yaml environment.flutter
  # geolocator_apple's Swift Package manifest reads this when resolving/building.
  # Mathani only uses explicit foreground detection; omit the Always API code.
  BYPASS_PERMISSION_LOCATION_ALWAYS: "1"

jobs:
  testflight:
    name: Build signed iOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Install distribution certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES/mathani-app-store.mobileprovision"
          # Xcode 16+ also reads profiles from this location.
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILES/mathani-app-store.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"
          rm "$RUNNER_TEMP/dist.p12"

      - name: Build signed .ipa
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=(--release --obfuscate --split-debug-info=symbols/ios
            --export-options-plist=ios/ExportOptions.plist)
          if [[ -n "$BUILD_NUMBER" ]]; then
            [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must contain only digits"; exit 1; }
            args+=(--build-number="$BUILD_NUMBER")
          fi
          flutter build ipa "${args[@]}"

      - name: Verify foreground-only location binary
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          app = pathlib.Path('build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info.get('NSLocationWhenInUseUsageDescription'), 'Missing foreground location purpose'
          assert 'location' not in info.get('UIBackgroundModes', []), 'Background location must remain disabled'
          binary = app / info['CFBundleExecutable']
          assert b'requestAlwaysAuthorization' not in binary.read_bytes(), 'Always location API is still linked'
          print('Verified foreground purpose, no background location mode, and no Always authorization selector')
          PY

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Keep the .ipa and the Dart symbols (needed to read obfuscated crash stack traces).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            symbols/ios
          if-no-files-found: ignore

      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/mathani-app-store.mobileprovision"
