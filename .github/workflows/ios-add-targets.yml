name: iOS add targets

# One time (specs/017 research R4): adds the widget extension, the watch app and the watch widget
# extension to ios/Runner.xcodeproj on macOS, and commits the project file to the branch it runs on.
# Run it from the Actions tab on the feature branch. Running it again does nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-targets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodeproj
        run: gem list -i xcodeproj || sudo gem install xcodeproj
      - name: Add the targets
        run: ruby tool/ios/add_widget_targets.rb
      - name: Commit the project file
        run: |
          if git diff --quiet -- ios/Runner.xcodeproj; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner.xcodeproj/project.pbxproj
          git commit -m "chore(ios): add widget and watch targets"
          git push
