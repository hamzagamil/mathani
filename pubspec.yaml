name: mathani
description: "Mathani (مثاني): read the Quran in Uthmani script."
publish_to: 'none'
version: 1.4.0+9

environment:
  sdk: ^3.13.5
  # Pinned to the SDK the project was created with (Flutter 3.47.7, Dart 3.13.5).
  flutter: 3.47.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  # On-device recognition for memorization (specs/006 research R6, R7, R10): exact versions.
  record: 7.1.2
  share_plus: ^13.3.1
  sherpa_onnx: 1.13.8
  sqflite: ^2.4.4+1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.7.0
  xml: ^7.1.0
  sqflite_common_ffi: ^2.4.3
  integration_test:
    sdk: flutter
  sqflite_common_ffi_web: ^1.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/images/
    # King Fahd Complex page fonts, one per page, gzip-compressed (specs/002, User Story 4).
    - assets/qcf/
    # Licences shown on the open-source licences page (registerAssetLicences).
    - assets/fonts/OFL-IBMPlexSansArabic.txt
    - assets/fonts/OFL-AmiriQuran.txt
    - assets/fonts/LICENSE-Lucide.txt
    # Memorization (specs/006): onnxruntime inside sherpa-onnx, and the downloaded model and VAD.
    # sherpa_onnx and record ship their own LICENSE files, which Flutter collects itself.
    - assets/licences/

  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Quran text. Amiri Quran (OFL) until KFGQPC permission (D1) is granted; see docs/licences.md.
    - family: QuranText
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # Lucide icons (ISC), tree-shaken to the glyphs in lib/shared/mathani_icons.dart.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
